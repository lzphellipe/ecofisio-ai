[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ecofisio-ai"
version = "0.1.0"
description = "Assistente de pesquisa em Ecofisiologia e Bioquímica Vegetal: pipeline de dados, modelos mecanísticos e preditivos, evidência verificável."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luiz Felipe Alves Lopes" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=15",
    "httpx>=0.27",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.115", "httpx>=0.27"]
rag = ["sentence-transformers>=3.0"]  # embeddings densos (opcional; sem ele, só BM25)
nli = ["transformers>=4.40", "torch>=2.2"]  # verificador semântico de citações
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]  # API HTTP para o front

[project.scripts]
ecofisio-corpus = "ecofisio.literature.corpus:main"
ecofisio-ask = "ecofisio.agent.cli:main"
ecofisio-eval = "ecofisio.eval.cli:main"
ecofisio-busca = "ecofisio.rag.cli:main"
ecofisio-dataset = "ecofisio.dataset.cli:main"
ecofisio-api = "ecofisio.api.app:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/ecofisio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa Depends()/Security() como default de argumento de propósito
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]
