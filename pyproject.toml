[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ecofisio-ai"
version = "0.1.0"
description = "Assistente de pesquisa em Ecofisiologia e Bioquímica Vegetal: pipeline de dados, modelos mecanísticos e preditivos, evidência verificável."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luiz Felipe Alves Lopes" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=15",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/ecofisio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
